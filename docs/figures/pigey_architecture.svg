<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Pigey capability-aware orchestration</title>
  <desc id="desc">Pigey routes rigid geometric tasks to TAMP first and uses a frozen VLA only for tasks unsuitable for TAMP or after repeated failures.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <style>
      .font { font-family: Arial, 'Microsoft YaHei', sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #111827; }
      .head { font-size: 23px; font-weight: 700; fill: #111827; }
      .body { font-size: 18px; fill: #374151; }
      .small { font-size: 16px; fill: #4b5563; }
      .tag { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
      .line { fill: none; stroke: #4b5563; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#f7f8fa"/>
  <text x="60" y="58" class="font title">Pigey：按能力路由，而不是让 VLA 包办</text>

  <g filter="url(#shadow)">
    <rect x="60" y="118" width="210" height="128" rx="18" fill="#ffffff" stroke="#d1d5db"/>
    <text x="165" y="161" text-anchor="middle" class="font head">任务 + 观测</text>
    <text x="165" y="194" text-anchor="middle" class="font body">语言指令 · RGB-D</text>
    <text x="165" y="222" text-anchor="middle" class="font body">机器人状态</text>
  </g>

  <path d="M270 182 H345" class="line"/>

  <g filter="url(#shadow)">
    <rect x="348" y="98" width="260" height="168" rx="20" fill="#fff3f9" stroke="#d6207e" stroke-width="2"/>
    <text x="478" y="142" text-anchor="middle" class="font head">Frontier VLM</text>
    <text x="478" y="176" text-anchor="middle" class="font body">观察 · 拆解 · 路由</text>
    <text x="478" y="207" text-anchor="middle" class="font body">验证 · 恢复</text>
    <rect x="398" y="224" width="160" height="28" rx="14" fill="#d6207e"/>
    <text x="478" y="244" text-anchor="middle" class="font tag" fill="#ffffff">ORCHESTRATOR</text>
  </g>

  <path d="M608 151 C684 151 681 132 752 132" class="line"/>
  <text x="680" y="113" text-anchor="middle" class="font tag" fill="#137a57">默认路径</text>

  <g filter="url(#shadow)">
    <rect x="755" y="82" width="385" height="156" rx="20" fill="#edf9f4" stroke="#26a269" stroke-width="2"/>
    <text x="790" y="118" class="font tag" fill="#137a57">TAMP FIRST</text>
    <text x="790" y="154" class="font head">刚性、几何可解任务</text>
    <text x="790" y="186" class="font body">感知 → Pick / DropAbove → 运动规划</text>
    <text x="790" y="216" class="font small">ER · SAM2 · Stereo · M2T2 · cuRobo / cuTAMP</text>
  </g>

  <path d="M608 225 C685 225 682 326 752 326" class="line"/>
  <text x="683" y="290" text-anchor="middle" class="font tag" fill="#31558a">按需调用</text>

  <g filter="url(#shadow)">
    <rect x="755" y="270" width="385" height="140" rx="20" fill="#eef4ff" stroke="#6e8bc0" stroke-width="2"/>
    <text x="790" y="306" class="font tag" fill="#31558a">VLA FALLBACK</text>
    <text x="790" y="342" class="font head">TAMP 不适合或连续失败</text>
    <text x="790" y="374" class="font body">软体 · 复杂接触 · 容器内 / 堆叠</text>
    <text x="790" y="399" class="font small">冻结的 π0.5，仅执行 VLARollout</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="348" y="376" width="260" height="116" rx="18" fill="#ffffff" stroke="#9ca3af"/>
    <text x="478" y="414" text-anchor="middle" class="font head">工具边界验证</text>
    <text x="478" y="445" text-anchor="middle" class="font body">is_grasped · wrist image</text>
    <text x="478" y="473" text-anchor="middle" class="font body">backend state · typed error</text>
  </g>

  <path d="M947 238 V253 C947 438 727 434 610 434" class="line"/>
  <path d="M755 344 C690 344 680 389 608 407" class="line"/>
  <path d="M348 434 C287 434 287 285 402 266" class="line"/>
  <text x="257" y="367" text-anchor="middle" class="font tag" fill="#b42318">失败 → 重感知 / 重试 / 换后端</text>
</svg>
